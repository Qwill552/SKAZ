name: Ошибка
description: Сообщить об ошибке SKAZ
labels: [bug]
body:
  - type: input
    id: os
    attributes:
      label: ОС и версия
      placeholder: Windows 11, Ubuntu 24.04, macOS 14
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Браузер и версия Tampermonkey
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Версия сервера
      description: Поле version из /health. Не публикуйте ключ из config.json.
    validations:
      required: true
  - type: input
    id: script
    attributes:
      label: Версия юзерскрипта
    validations:
      required: true
  - type: input
    id: site
    attributes:
      label: Сайт или тип страницы
      description: Если ссылка приватная, опишите тип страницы.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как повторить
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Что ожидали и что произошло
    validations:
      required: true
