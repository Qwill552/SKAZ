name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -c "import os; from server.version import VERSION; assert os.environ['GITHUB_REF_NAME'] == 'v' + VERSION"
      - run: python packaging/release_test.py
      - run: node --check userscript/skaz.user.js
      - run: python packaging/build_release.py
      - uses: softprops/action-gh-release@v2
        with:
          body_path: dist/release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/skaz-windows.zip
            dist/skaz-linux.tar.gz
            dist/skaz-macos.tar.gz
            dist/skaz.user.js
            dist/version.json
