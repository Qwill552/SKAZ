[project]
name = "skaz-server"
version = "1.0.1"
description = "SKAZ local TTS server"
requires-python = ">=3.12,<3.13"
dependencies = [
    "num2words>=0.5.14",
    "numpy>=2.5.3; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "numpy>=1.26,<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "qrcode>=8.2",
    "scipy>=1.18.1; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "scipy==1.12.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch>=2.14.0; sys_platform == 'linux' or (sys_platform == 'darwin' and platform_machine == 'arm64')",
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.scripts]
server = "server.main:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "server"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
