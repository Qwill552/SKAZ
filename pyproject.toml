[project]
name = "skaz-server"
version = "1.0.1"
description = "SKAZ — локальный TTS-сервер (Silero)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "num2words>=0.5.14",
    "numpy>=2.5.3",
    "qrcode>=8.2",
    "scipy>=1.18.1",
    "torch>=2.14.0",
]

[project.scripts]
server = "server.main:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "server"
